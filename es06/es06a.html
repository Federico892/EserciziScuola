<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatrice JS</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4.9;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        h2 { color: #333; }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #risultato-box {
            margin-top: 20px;
            padding: 10px;
            border-radius: 6px;
            min-height: 40px;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>Calcolatrice JS</h2>
    <p>Clicca il pulsante per avviare il calcolo</p>
    <button onclick="avviaCalcolo()">Avvia Calcolo</button>

    <div id="risultato-box" style="display: none;">
        <span id="messaggio"></span>
    </div>
</div>

<script>
    function avviaCalcolo() {
        const resBox = document.getElementById('risultato-box');
        const messaggio = document.getElementById('messaggio');
        
        // Reset interfaccia
        resBox.style.display = "none";
        resBox.className = "";

        // 1. Input utente
        const input1 = prompt("Inserisci il primo numero:");
        const input2 = prompt("Inserisci il secondo numero:");
        const operazione = prompt("Scegli l'operazione (+, -, *, /, **):");

        // 2. Conversione rigorosa con Number()
        const num1 = Number(input1);
        const num2 = Number(input2);

        let risultato;
        let erroreMsg = "";

        // 3. Validazione
        if (input1 === null || input1.trim() === "" || isNaN(num1) || 
            input2 === null || input2.trim() === "" || isNaN(num2)) {
            erroreMsg = "Errore: Inserisci numeri validi!";
        } else if (!operazione) {
            erroreMsg = "Errore: Operazione non inserita!";
        } else {
            // 4. Logica switch
            switch (operazione) {
                case "+":
                    risultato = num1 + num2;
                    break;
                case "-":
                    risultato = num1 - num2;
                    break;
                case "*":
                    risultato = num1 * num2;
                    break;
                case "/":
                    if (num2 === 0) {
                        erroreMsg = "Errore: Divisione per zero!";
                    } else {
                        risultato = num1 / num2;
                    }
                    break;
                case "**":
                    risultato = num1 ** num2;
                    break;
                default:
                    erroreMsg = "Errore: Operatore '" + operazione + "' non valido!";
            }
        }

        // 5. Visualizzazione Risultato nel DOM
        resBox.style.display = "block";
        if (erroreMsg) {
            resBox.classList.add('error');
            messaggio.innerText = erroreMsg;
        } else {
            resBox.classList.add('success');
            messaggio.innerText = `Risultato: ${num1} ${operazione} ${num2} = ${risultato}`;
        }
    }
</script>

</body>
</html>
